[pytest]
# Only collect the maintained test suite. Root-level scripts and examples may
# perform live network calls or interactive diagnostics during import.
testpaths = tests

# Integration tests are opt-in.
addopts = -m "not integration and not live" -k "not (test_server_config or test_stock_codes)"

markers =
    integration: integration/end-to-end tests (skipped by default)
    live: historical diagnostics that require real external services, credentials, or removed APIs
